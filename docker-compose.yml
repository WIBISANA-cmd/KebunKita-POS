# Deployment Kebun Kita POS. Dipakai langsung oleh Dokploy (tipe Compose).
#
# Semua layanan diberi jaringan eksplisit dan nama berawalan "kebunkita-": saat domain
# dipasang, Dokploy menambahkan dokploy-network ke layanan aplikasi. Jaringan internal
# harus tetap ada agar aplikasi menjangkau database, dan nama unik mencegah bentrok DNS
# dengan aplikasi lain di dokploy-network.

x-image-aplikasi: &image-aplikasi
  image: kebunkita-pos:latest
  pull_policy: never
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - kebunkita
  volumes:
    - kebunkita_storage:/var/www/html/storage/app
  depends_on:
    kebunkita-app:
      condition: service_healthy

services:
  kebunkita-db:
    image: postgres:18-alpine
    restart: unless-stopped
    command: postgres -c timezone=Asia/Jakarta -c log_timezone=Asia/Jakarta
    environment:
      POSTGRES_DB: ${DB_DATABASE:-kebun_kita}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD wajib diisi}
    networks:
      - kebunkita
    volumes:
      - kebunkita_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  kebunkita-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: produksi
    image: kebunkita-pos:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "true"
    expose:
      - "80"
    networks:
      - kebunkita
    volumes:
      - kebunkita_storage:/var/www/html/storage/app
    depends_on:
      kebunkita-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/up"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  kebunkita-reverb:
    <<: *image-aplikasi
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080", "--no-interaction"]
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8080"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  kebunkita-queue:
    <<: *image-aplikasi
    command: ["php", "artisan", "queue:work", "--tries=3", "--timeout=90", "--sleep=3", "--max-time=3600"]

  kebunkita-scheduler:
    <<: *image-aplikasi
    command: ["php", "artisan", "schedule:work"]

networks:
  kebunkita:

volumes:
  kebunkita_db:
  kebunkita_storage:
