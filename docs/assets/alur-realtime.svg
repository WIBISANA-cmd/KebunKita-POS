<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 340" width="1100" height="340" role="img" aria-label="Alur notifikasi realtime: kasir menyimpan penjualan ke Laravel dan PostgreSQL, Laravel menyiarkan ke Reverb, Reverb mendorong ke lonceng di semua perangkat cabang">
  <defs>
    <linearGradient id="latar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3f26"/>
      <stop offset="1" stop-color="#0f6a48"/>
    </linearGradient>
    <style>
      text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
      .kotak { fill: #ffffff; }
      .nama { font-size: 19px; font-weight: 700; fill: #0b4a2b; }
      .ket { font-size: 13.5px; fill: #3d4f46; }
      .judul { font-size: 22px; font-weight: 700; fill: #ffffff; }
      .lab { font-size: 13.5px; font-weight: 600; fill: #bfe6da; }
      .jalur { fill: none; stroke: #5fdc96; stroke-opacity: .4; stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 9; }
      .denyut { transform-box: fill-box; transform-origin: center; animation: d 2.4s ease-out infinite; }
      @keyframes d { from { transform: scale(.8); opacity: .8; } to { transform: scale(1.3); opacity: 0; } }
    </style>
  </defs>

  <rect width="1100" height="340" rx="26" fill="url(#latar)"/>
  <text class="judul" x="40" y="48">Satu transaksi, semua lonceng di cabang ikut berbunyi</text>

  <path id="j1" class="jalur" d="M226 145H335"/>
  <path id="j2" class="jalur" d="M535 120H650"/>
  <path id="j3" class="jalur" d="M435 195V248H650"/>
  <path id="j4" class="jalur" d="M850 248H905"/>

  <g transform="translate(40 92)">
    <rect class="kotak" width="186" height="106" rx="18"/>
    <text class="nama" x="93" y="44" text-anchor="middle">Perangkat Kasir</text>
    <text class="ket" x="93" y="70" text-anchor="middle">POST /api/v1/penjualan</text>
  </g>
  <g transform="translate(335 92)">
    <rect class="kotak" width="200" height="106" rx="18"/>
    <text class="nama" x="100" y="44" text-anchor="middle">Laravel API</text>
    <text class="ket" x="100" y="70" text-anchor="middle">Transaksi FEFO atomik</text>
  </g>
  <g transform="translate(650 92)">
    <rect class="kotak" width="200" height="56" rx="18"/>
    <text class="nama" x="100" y="35" text-anchor="middle">PostgreSQL</text>
  </g>
  <g transform="translate(650 210)">
    <rect class="kotak" width="200" height="84" rx="18"/>
    <text class="nama" x="100" y="38" text-anchor="middle">Reverb</text>
    <text class="ket" x="100" y="62" text-anchor="middle">Kanal privat cabang</text>
  </g>
  <g transform="translate(905 205)">
    <circle class="denyut" cx="77" cy="46" r="52" fill="#5fdc96"/>
    <rect class="kotak" width="155" height="94" rx="18"/>
    <text class="nama" x="77" y="38" text-anchor="middle">Lonceng</text>
    <text class="ket" x="77" y="62" text-anchor="middle">Semua perangkat</text>
  </g>

  <text class="lab" x="280" y="136" text-anchor="middle">1. Simpan</text>
  <text class="lab" x="592" y="110" text-anchor="middle">2. Commit</text>
  <text class="lab" x="540" y="238" text-anchor="middle">3. Siarkan setelah respons</text>
  <text class="lab" x="878" y="195" text-anchor="middle">4. WebSocket</text>

  <circle r="7" fill="#ffa94d">
    <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="0;1;1" keyTimes="0;.22;1" calcMode="linear"><mpath href="#j1"/></animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.22;.23;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#5fdc96">
    <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.22;.44;1" calcMode="linear"><mpath href="#j2"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.21;.22;.44;.45;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#ffffff">
    <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.44;.72;1" calcMode="linear"><mpath href="#j3"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.43;.44;.72;.73;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="7" fill="#ffffff">
    <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;.72;.86;1" calcMode="linear"><mpath href="#j4"/></animateMotion>
    <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.71;.72;.86;.87;1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
</svg>
