worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 22m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    map $http_upgrade $sambungan_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80 default_server;
        root /var/www/html/public;
        index index.php;

        # DNS internal Docker: nama layanan Reverb di-resolve saat dipakai,
        # jadi nginx tetap menyala walau container Reverb sedang restart.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # WebSocket Reverb lewat domain yang sama dengan aplikasi
        location /app/ {
            set $alamat_reverb http://kebunkita-reverb:8080;
            proxy_pass $alamat_reverb;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $sambungan_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
            fastcgi_read_timeout 60s;
        }

        location ~ /\.(?!well-known) {
            deny all;
        }
    }
}
